<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review bug report</title>
<link rel="stylesheet" href="preview.css">
</head>
<body>
<main>
  <h1>Review bug report</h1>
  <p class="nav"><a href="tracker.html">Bug tracker</a></p>
  <p class="lead">Check everything below. Nothing goes to GitHub until you press <strong>Open on GitHub</strong>,
    and the issue is only created when you click <strong>Create</strong> there.</p>

  <p id="missing" class="warn" hidden>This report wasn't found. It may have been cleared (only the last 10 are kept).</p>

  <section class="media">
    <figure id="videoBox" hidden>
      <video id="video" controls></video>
      <figcaption>
        <label><input type="checkbox" id="includeVideo" checked> Attach video</label>
        <span id="videoSize"></span>
      </figcaption>
    </figure>
    <figure id="shotBox" hidden>
      <img id="shot" alt="Screenshot of the page when recording stopped">
      <figcaption>
        <label><input type="checkbox" id="includeShot" checked> Attach screenshot</label>
      </figcaption>
    </figure>
  </section>

  <form id="form">
    <div class="row combo-row">
      <label for="repo">Repository <span class="hint">click to see all · type to search · or type owner/name</span></label>
      <div class="combo" id="repoCombo">
        <input id="repo" role="combobox" aria-expanded="false" aria-controls="repoOptions" aria-autocomplete="list"
               autocomplete="off" spellcheck="false">
        <button type="button" id="repoToggle" class="combo-toggle" aria-label="Show repositories" tabindex="-1">▾</button>
        <ul id="repoOptions" role="listbox" aria-label="Repositories" hidden></ul>
      </div>
      <p class="hint" id="repoWhy"></p>
      <p class="hint" id="githubConn"></p>
    </div>

    <div class="row combo-row assignees">
      <label for="assigneeInput">Assignees <span id="assigneeCount" class="hint"></span></label>
      <div class="combo" id="assigneeCombo">
        <input id="assigneeInput" role="combobox" aria-expanded="false" aria-controls="assigneeOptions" aria-autocomplete="list"
               autocomplete="off" spellcheck="false" placeholder="Search people…">
        <button type="button" id="assigneeToggle" class="combo-toggle" aria-label="Show people" tabindex="-1">▾</button>
        <ul id="assigneeOptions" role="listbox" aria-label="People who can be assigned" hidden></ul>
      </div>
      <ul id="assigneeChips" class="chips" aria-label="Selected assignees"></ul>
      <input id="assigneeText" placeholder="GitHub usernames, comma-separated" aria-label="Assignees" hidden>
      <p class="hint" id="assigneeHint"></p>
    </div>

    <div class="row combo-row">
      <label for="labelInput">Labels <span id="labelCount" class="hint"></span></label>
      <div class="combo" id="labelCombo">
        <input id="labelInput" role="combobox" aria-expanded="false" aria-controls="labelOptions" aria-autocomplete="list"
               autocomplete="off" spellcheck="false" placeholder="Search labels…">
        <button type="button" id="labelToggle" class="combo-toggle" aria-label="Show labels" tabindex="-1">▾</button>
        <ul id="labelOptions" role="listbox" aria-label="Labels in this repository" hidden></ul>
      </div>
      <ul id="labelChips" class="chips" aria-label="Selected labels"></ul>
      <input id="labelText" placeholder="Label names, comma-separated" aria-label="Labels" hidden>
      <p class="hint" id="labelHint"></p>
    </div>

    <label>Title <span class="hint">&lt;Screen/feature&gt;: &lt;what goes wrong&gt; · max 90 characters, no environment name</span>
      <input id="title" maxlength="90" placeholder="App configuration: dependent field not shown after selecting Yes">
    </label>
    <p class="hint">Similar issues: <a id="dupLink" target="_blank" rel="noopener">search open issues</a></p>

    <label>Environment <input id="env"></label>
    <label>Summary <span class="hint">2–3 sentences: what breaks and who is affected</span>
      <textarea id="summary" rows="3"></textarea></label>
    <label>Preconditions <span class="hint">role you log in as, campaign state or data needed before step 1</span>
      <textarea id="preconditions" rows="2"></textarea></label>
    <label>Steps to reproduce <span class="hint">drafted from your clicks; check and add the values you typed</span>
      <textarea id="steps" rows="8"></textarea></label>
    <div class="row two">
      <label>Expected <textarea id="expected" rows="3"></textarea></label>
      <label>Actual <textarea id="actual" rows="3"></textarea></label>
    </div>
    <label>Evidence <span class="hint">failing API calls and console errors, already redacted</span>
      <textarea id="evidence" rows="8" class="mono"></textarea></label>
    <p class="hint" id="redactions"></p>
    <p class="warn" id="captureNote" hidden></p>
    <label>Notes <span class="hint">root cause if known, workaround, other envs/campaigns affected</span>
      <textarea id="notes" rows="2"></textarea></label>
    <div class="row four">
      <label>Bug type <select id="type"></select></label>
      <label>Severity <select id="severity"></select></label>
      <label>Priority <select id="priority"></select></label>
      <label>Component <input id="component"></label>
    </div>

    <label class="check"><input type="checkbox" id="pii">
      I watched the video and checked the screenshot and text: no names, phone numbers, IDs or real household data.
      Both repositories are public.</label>

    <div class="actions">
      <button type="submit" id="open" class="primary">Open on GitHub</button>
      <button type="button" id="copy">Copy as Markdown</button>
      <button type="button" id="downloadVideo">Download video</button>
      <button type="button" id="discard" class="danger">Discard</button>
    </div>
    <p id="status" role="status"></p>
  </form>
</main>
<script type="module" src="preview.js"></script>
</body>
</html>
